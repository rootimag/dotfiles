[config]
default_type = "scheme-tonal-spot"

[templates.niri]
input_path = 'templates/niri-colors.kdl'
output_path = '~/.cache/matugen/niri-colors.kdl'
post_hook = 'niri msg action load-config-file && echo -e "\e[32m[ OK ] niri 颜色已更新\e[0m"'

[templates.rofi]
input_path = 'templates/rofi-colors.rasi'
output_path = '~/.cache/matugen/rofi-colors.rasi'
post_hook = 'echo -e "\e[32m[ OK ] rofi 颜色已更新\e[0m"'

[templates.pywalfox]
input_path = 'templates/pywalfox-colors.json'
output_path = '~/.cache/wal/colors.json'
post_hook = 'setsid pywalfox update & echo -e "\e[32m[ OK ] firefox 颜色已更新\e[0m"'

[templates.hyprlock]
input_path = 'templates/hyprlock-colors.conf'
output_path = '~/.cache/matugen/hyprlock-colors.conf'
post_hook = 'echo -e "\e[32m[ OK ] hyprlock 颜色已更新\e[0m"'

[templates.mako]
input_path = 'templates/mako-colors'
output_path = '~/.config/mako/config'
post_hook = 'makoctl reload || (mako &) && echo -e "\e[32m[ OK ] mako 颜色已更新\e[0m"'

[templates.gtk3]
input_path = 'templates/gtk-colors.css'
output_path = '~/.config/gtk-3.0/colors.css'
post_hook = 'mkdir -p ~/.config/gtk-4.0 && cp ~/.config/gtk-3.0/colors.css ~/.config/gtk-4.0/colors.css && echo -e "\e[32m[ OK ] gtk 颜色已更新\e[0m"' 

[templates.kitty]
input_path = 'templates/kitty-colors.conf'
output_path = '~/.cache/matugen/kitty-colors.conf'
post_hook = 'pkill -USR1 kitty && echo -e "\e[32m[ OK ] kitty 颜色已更新\e[0m"'

[templates.fzf]
input_path = 'templates/fzf-colors.zsh'
output_path = '~/.cache/matugen/fzf-colors.zsh'
post_hook = 'echo -e "\e[32m[ OK ] fzf 颜色已更新\e[0m"'

[templates.starship]
input_path = 'templates/starship-colors.toml'
output_path = '~/.config/starship.toml'
post_hook = 'echo -e "\e[32m[ OK ] starship 颜色已更新\e[0m"'

[templates.wlogout]
input_path = 'templates/wlogout-colors.css'
output_path = '~/.cache/matugen/wlogout/wlogout-colors.css'
post_hook = 'echo -e "\e[32m[ OK ] wlogout 颜色已更新\e[0m"'

[templates.wlogout-recolor]
input_path = 'templates/wlogout/recolor.sh'
output_path = '~/.cache/matugen/wlogout/icons/recolor.sh'
post_hook = 'chmod +x ~/.cache/matugen/wlogout/icons/recolor.sh && (setsid bash ~/.cache/matugen/wlogout/icons/recolor.sh > /dev/null 2>&1 &) && echo -e "\e[32m[ OK ] wlogout icon 颜色已更新\e[0m"'

[templates.waybar]
input_path = 'templates/waybar-colors.css'
output_path = '~/.cache/matugen/waybar-colors.css'
post_hook = 'killall -SIGUSR2 waybar & echo -e "\e[32m[ OK ] waybar 颜色已更新\e[0m"'

[templates.kvantum_svg]
input_path  = 'templates/orchis-colors.svg'
output_path = '~/.config/Kvantum/OrchisDark/OrchisDark.svg'
post_hook = 'echo -e "\e[32m[ OK ] kvantum 颜色已更新\e[0m"'

[templates.kvantum]
input_path  = 'templates/orchis-colors.kvconfig'
output_path = '~/.config/Kvantum/OrchisDark/OrchisDark.kvconfig'
